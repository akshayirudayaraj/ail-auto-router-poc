<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ail-routing-test · console</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">⇌</span>
      <div>
        <h1>ail-routing-test</h1>
        <p class="sub">predictive auto-router · console</p>
      </div>
    </div>
    <nav id="tabs">
      <button data-tab="overview" class="active">Overview</button>
      <button data-tab="traces">Traces</button>
      <button data-tab="data">Labeled data</button>
      <button data-tab="fit">Fit &amp; evaluate</button>
      <button data-tab="route">Route a prompt</button>
    </nav>
    <div id="backend-pill" class="pill">…</div>
  </header>

  <main>
    <!-- OVERVIEW -->
    <section id="overview" class="tab active">
      <div id="overview-cards" class="cards"></div>
      <div id="overview-note" class="note"></div>
    </section>

    <!-- TRACES -->
    <section id="traces" class="tab">
      <div class="split">
        <aside class="list" id="trace-list"></aside>
        <div class="detail" id="trace-detail">
          <p class="muted">Select a session to view its trace.</p>
        </div>
      </div>
    </section>

    <!-- DATA -->
    <section id="data" class="tab">
      <div class="subtabs" id="data-subtabs">
        <button data-ds="pointwise" class="active">Pointwise</button>
        <button data-ds="pairwise">Pairwise</button>
        <button data-ds="gold">Gold (dual-arm)</button>
      </div>
      <div class="toolbar" id="data-toolbar"></div>
      <div class="tablewrap"><table id="data-table"></table></div>
    </section>

    <!-- FIT -->
    <section id="fit" class="tab">
      <div class="panel">
        <div class="controls">
          <label>Train label source
            <select id="fit-source">
              <option value="implicit">implicit</option>
              <option value="judge">judge</option>
            </select>
          </label>
          <label>Operating threshold
            <input id="fit-threshold" type="number" min="0" max="1" step="0.05" value="0.5">
          </label>
          <button id="fit-run" class="primary">Fit routers</button>
          <span id="fit-status" class="muted"></span>
        </div>
      </div>
      <h3>IRT ability recovery <span class="muted">(θ, reference-centered)</span></h3>
      <div class="tablewrap"><table id="fit-abilities"></table></div>
      <h3>Gold leaderboard <span class="muted">(dual-arm; absolute numbers)</span></h3>
      <div class="tablewrap"><table id="fit-leaderboard"></table></div>
      <p class="muted small" id="fit-legend"></p>
    </section>

    <!-- ROUTE -->
    <section id="route" class="tab">
      <div class="panel route-panel">
        <label class="block">New prompt
          <textarea id="route-prompt" rows="5" placeholder="e.g. Implement a thread-safe LRU cache in Go with O(1) Get/Put."></textarea>
        </label>
        <div class="controls">
          <label>Turn type
            <select id="route-turntype">
              <option value="open">open</option>
              <option value="followup">followup</option>
            </select>
          </label>
          <label>Threshold
            <input id="route-threshold" type="number" min="0" max="1" step="0.05" value="0.5">
          </label>
          <button id="route-run" class="primary">Route</button>
          <span id="route-status" class="muted"></span>
        </div>
        <div class="examples" id="route-examples"></div>
      </div>
      <div id="route-result"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
